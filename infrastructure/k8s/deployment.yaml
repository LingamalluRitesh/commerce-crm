apiVersion: apps/v1
kind: Deployment
metadata:
  name: commercecrm-backend-api
  namespace: commercecrm-production
  labels:
    app.kubernetes.io/name: commercecrm-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: commercecrm-os
    app.kubernetes.io/version: "2.4.0"
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: commercecrm-backend
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: commercecrm-backend
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api-server
          image: ghcr.io/lingamalluritesh/commerce-crm-backend:v2.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: commercecrm-config
            - secretRef:
                name: commercecrm-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commercecrm-web-frontend
  namespace: commercecrm-production
  labels:
    app.kubernetes.io/name: commercecrm-frontend
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: commercecrm-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: commercecrm-frontend
    spec:
      containers:
        - name: web
          image: ghcr.io/lingamalluritesh/commerce-crm-web:v2.4.0
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
